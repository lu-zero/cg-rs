[package]
name = "cgconfig"
description = "winnow parsers for libcgroup cgconfig.conf and cgrules.conf"
keywords = ["cgroup", "libcgroup", "parser", "cgconfig", "cgrules"]
categories = ["parser-implementations", "os::unix-apis"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
winnow = { workspace = true }
# Core protocol only (Diagnostic, LabeledSpan, NamedSource); no derive,
# no renderer. Consumers opt into `miette/features = ["fancy"]` themselves.
miette = { workspace = true }

[dev-dependencies]
miette = { workspace = true, features = ["fancy-no-backtrace"] }

[package.metadata.docs.rs]
all-features = true
