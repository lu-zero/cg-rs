[package]
name = "cgfs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "cgroupfs v2 management: create, delegate, attach, delete, walk, raw control-file access"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lu_zero/cgfs"
keywords = ["cgroup", "cgroupv2", "cgroupfs", "linux"]
categories = ["os::unix-apis"]

[dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
